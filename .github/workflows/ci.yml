name: Python tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Unix supervisor tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Run native Windows compatibility tests
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p 'test_portable_windows.py' -v
          python -m unittest discover -s tests -p 'test_release_packaging.py' -v
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Check shell script syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh relaywatch.sh start-linux.sh start-macos.sh interactive-agent.sh
      - name: Check Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
